# nginx-Konfiguration für vwsync-api. Servernamen und Zertifikatspfade anpassen.
# Debian: /etc/nginx/sites-available/vwsync, Rocky Linux und RHEL: /etc/nginx/conf.d/vwsync.conf.
# Den Zugangsschlüssel prüft der Dienst selbst. nginx sorgt für TLS und begrenzt Anfragen je Adresse.
limit_req_zone $binary_remote_addr zone=vwsync:1m rate=60r/m;

server {
    listen 80;
    server_name vwsync.example.com;
    return 301 https://$host$request_uri;
}

server {
    # "listen ... http2" statt "http2 on;": versteht jede nginx-Version, auch 1.20 aus Rocky Linux 9.
    # Neuere Versionen melden dazu nur einen Hinweis, keinen Fehler.
    listen 443 ssl http2;
    server_name vwsync.example.com;

    ssl_certificate     /etc/letsencrypt/live/vwsync.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vwsync.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    location / {
        limit_req zone=vwsync burst=30 nodelay;
        include /etc/nginx/vwsync-proxy.inc;
    }
}

# Als /etc/nginx/vwsync-proxy.inc speichern:
#
#   proxy_pass         http://127.0.0.1:8080;
#   proxy_set_header   Host $host;
#   proxy_set_header   X-Real-IP $remote_addr;
#   # Ein Sync oder Confirm kann bei vielen Mitgliedern Minuten dauern.
#   proxy_read_timeout 600s;
#   proxy_send_timeout 600s;
