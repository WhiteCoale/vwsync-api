# Site config for nginx. Replace the server name and certificate paths.
# The service checks the access key itself. nginx adds TLS and limits requests per address.
limit_req_zone $binary_remote_addr zone=vwsync:1m rate=60r/m;

server {
    listen 80;
    server_name vwsync.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name vwsync.example.com;

    ssl_certificate     /etc/letsencrypt/live/vwsync.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vwsync.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    location / {
        limit_req zone=vwsync burst=30 nodelay;
        include /etc/nginx/vwsync-proxy.inc;
    }
}

